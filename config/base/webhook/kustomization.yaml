apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- manifests.yaml
- webhook-backend.yaml


patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: certificates-validating
  target:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration

replacements:
- source:
    kind: ConfigMap
    name: webhook-backend
    fieldPath: data.name
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.name
- source:
    kind: ConfigMap
    name: webhook-backend
    fieldPath: data.namespace
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.namespace
