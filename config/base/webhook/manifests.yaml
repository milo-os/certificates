---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-certificates-miloapis-com-v1alpha1-tlscertificate
  failurePolicy: Fail
  name: mtlscertificate.kb.io
  rules:
  - apiGroups:
    - certificates.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tlscertificates
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-certificates-miloapis-com-v1alpha1-tlscertificate
  failurePolicy: Fail
  name: vtlscertificate.kb.io
  rules:
  - apiGroups:
    - certificates.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - tlscertificates
  sideEffects: None
